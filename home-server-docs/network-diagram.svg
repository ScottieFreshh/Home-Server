<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Home network star topology</title>
<desc>A central switch connected by Cat6 ethernet to a combined router and modem at 192.168.1.254, a server at 192.168.1.194, a main PC at 192.168.1.233, and a wireless access point.</desc>
<rect width="680" height="470" fill="#ffffff"/>
<g stroke="#5F5E5A" stroke-width="2.5" stroke-linecap="round">
<line x1="340" y1="86" x2="340" y2="190"/>
<line x1="220" y1="220" x2="270" y2="220"/>
<line x1="410" y1="220" x2="460" y2="220"/>
<line x1="340" y1="250" x2="340" y2="354"/>
</g>
<g text-anchor="middle" dominant-baseline="central">
<rect x="250" y="30" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="48" font-size="14" font-weight="600" fill="#3C3489">Router / modem</text>
<text x="340" y="68" font-size="12" fill="#534AB7">192.168.1.254</text>
<rect x="270" y="190" width="140" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="211" font-size="14" font-weight="600" fill="#3C3489">Switch</text>
<text x="340" y="231" font-size="12" fill="#534AB7">Center of star</text>
<rect x="40" y="192" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="130" y="210" font-size="14" font-weight="600" fill="#085041">Server</text>
<text x="130" y="230" font-size="12" fill="#0F6E56">192.168.1.194</text>
<rect x="460" y="192" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="550" y="210" font-size="14" font-weight="600" fill="#085041">Main PC</text>
<text x="550" y="230" font-size="12" fill="#0F6E56">192.168.1.233</text>
<rect x="250" y="354" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="372" font-size="14" font-weight="600" fill="#3C3489">Wireless access point</text>
<text x="340" y="392" font-size="12" fill="#534AB7">Wi-Fi clients</text>
</g>
<g dominant-baseline="central" font-size="12" fill="#444441">
<line x1="40" y1="441" x2="76" y2="441" stroke="#5F5E5A" stroke-width="2.5" stroke-linecap="round"/>
<text x="84" y="441">Cat6 ethernet</text>
<rect x="200" y="433" width="16" height="16" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="224" y="441">Network gear</text>
<rect x="340" y="433" width="16" height="16" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="364" y="441">Hosts</text>
</g>
</svg>
