# Example docker-compose.yml
# Replace with your actual services. Keep this file in version control
# alongside the docs so configs and documentation never drift apart.
# Never commit real secrets — use a .env file (gitignored) or Docker secrets.

services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "443,443"
      - "80:80"
      - 8081:8080
    environment:
      TZ: 'America/New_York'
      WEBPASSWORD_FILE: /run/secrets/pihole_password
    volumes:
      - (pwd)/etc-pihole/:/etc/pihole/
      - (pwd)/etc-dnsmasq.d/:/etc/dnsmasq.d/
    secrets:
      - pihole_password
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce.lts
    container_name: portainer
    ports:
      - "9443:9443"
      - "8000:8000"
    environment:
      TZ: 'America/New_York'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: always 

  Uptime Kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    ports:
      -3001:3001
    volumes:
      - uptime-kuma:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always


